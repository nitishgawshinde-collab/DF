dxExpandAll=function(){const rows=dxFiltered().slice(dxPage*dxPageSize,(dxPage+1)*dxPageSize),all=rows.every(r=>dxExp.has(r.id));rows.forEach(r=>all?dxExp.delete(r.id):dxExp.add(r.id));document.getElementById('dxTable').innerHTML=dxTable();};
dxPickStatus=function(g){dxStatus=dxStatus===g?null:g;dxView='all';dxPage=0;render();};
dxDonut=function(rows){const total=rows.length,groups=DX_STATUS.map(([g,c])=>({g,c,n:rows.filter(r=>dxGroup(r.status)===g).length})).filter(g=>g.n);let offset=0;const circ=2*Math.PI*74;
 return `<div class="dx-donut"><svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="${total} active work items; use the adjacent status buttons for exact counts and filtering"><circle r="74" cx="100" cy="100" fill="none" stroke="#f1f3f5" stroke-width="20"/>${groups.map(g=>{const len=circ*g.n/total,o=offset;offset+=len;return `<circle r="74" cx="100" cy="100" fill="none" stroke="${g.c}" stroke-width="20" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-o}" transform="rotate(-90 100 100)"/>`;}).join('')}<text x="100" y="100" text-anchor="middle" class="dx-dn">${total}</text><text x="100" y="122" text-anchor="middle" class="dx-dl">active work items</text></svg><ul>${groups.map(g=>`<li class="dx-status-item"><button class="dx-status-button ${dxStatus===g.g?'on':''}" aria-pressed="${dxStatus===g.g}" onclick="dxPickStatus('${g.g}')"><i style="background:${g.c}"></i><span>${g.g}</span><b>${g.n}</b><span>${Math.round(g.n/total*100)}%</span></button></li>`).join('')||'<li>No active work in this scope.</li>'}</ul></div>`;
};
function dxMix(rows){const max=Math.max(1,...Object.keys(DX_TYPES).map(k=>rows.filter(r=>r.type===k).length));return `<div class="dx-mix">${Object.entries(DX_TYPES).map(([k,label])=>{const count=rows.filter(r=>r.type===k).length;return `<button class="dx-mix-item" aria-pressed="${dxType===k}" onclick="dxType=dxType==='${k}'?'all':'${k}';dxPage=0;render()"><span>${label}</span><span class="dx-mix-track" aria-hidden="true"><i style="width:${count/max*100}%"></i></span><b>${count}</b></button>`;}).join('')}</div><p class="sub">Current scoped workload, grouped by family. No historical trend or SLA success rate is inferred.</p>`;}
dxTypeLists=function(rows){const unique=new Map();rows.forEach(r=>r.documents.forEach(d=>unique.set(d.id,d)));const groups=new Map();unique.forEach(d=>{const key=JSON.stringify([d.code,d.owner||'Not specified',d.subtype||'Not specified']);const g=groups.get(key)||{label:dxEvidenceLabel(d),code:d.code,owner:d.owner||'Not specified',subtype:d.subtype||'Not specified',count:0};g.count++;groups.set(key,g);});const list=[...groups.values()].sort((a,b)=>b.count-a.count),shown=dxAllDocs?list:list.slice(0,5);
 return `<div class="dx-row3"><section class="dx-panel"><div class="dx-ph"><div><h2>Evidence in this scope</h2><p class="sub">${unique.size} unique document records · linked to cases or awaiting verification</p></div></div><ul class="dx-list">${shown.map(g=>`<li><span class="dx-code">${esc(g.code)}</span><div><b>${esc(g.label)}</b><small>${esc(g.owner)} · ${esc(g.subtype)}</small></div><div class="dx-count">${g.count}</div></li>`).join('')||'<li class="dx-empty">No evidence records in this scope.</li>'}</ul>${list.length>5?`<button class="dx-btn" onclick="dxAllDocs=!dxAllDocs;render()">${dxAllDocs?'Show fewer':'View all'}</button>`:''}</section><section class="dx-panel"><h2>Completion & archival</h2><p class="sub">Closed cases and accepted documents leave the active worklist. Their records remain in the existing shared history views.</p><div class="dx-history-links"><button class="dx-btn" onclick="navigate('completed')">Completion library →</button><button class="dx-btn" onclick="navigate('documents')">File cabinets →</button><button class="dx-btn" onclick="navigate('archive')">Archival →</button></div><p class="sub">Document verification, Tax approval, account availability and operational implementation remain separate outcomes.</p></section></div>`;
};
dxExport=function(){const rows=dxFiltered(),q=v=>'"'+String(v??'').replace(/^[\s]*[=+@-]/,"'$&").replace(/"/g,'""')+'"';download('docuflow-active-work.csv',[['Scope','Kind','Workflow','ID','Client','Evidence types','Owner','Team','Documents','Due date','Due indicator','Status','Configured priority'],...rows.map(r=>[dxScope,r.kind,r.wf,r.id,r.client,r.code,r.owner,r.team,r.files,r.due,dxSla(r.status,r.due)[0],r.status,r.priority])].map(row=>row.map(q).join(',')).join('\n'),'text/csv');};
overviewView=function(){
 if(dxPersona!==persona){dxPersona=persona;dxScope='mine';dxResetDashboard();}
 const all=dxScopedRows(),overdue=all.filter(r=>r.due&&r.due<DX_TODAY),today=all.filter(r=>r.due===DX_TODAY),cases=all.filter(r=>r.kind==='case'),docs=all.filter(r=>r.kind!=='case'),focus=roleFocus[persona];
 const kpi=(label,value,note)=>`<div class="dx-kpi"><div class="top">${label}</div><strong>${value}</strong><small>${note}</small></div>`;
 return `<div class="dx"><div class="dx-head"><div><div class="eyebrow">Client Operations · ${dxScope==='mine'?'My work':'Shared workspace'}</div><h1>Welcome back, ${esc(people[persona].name.split(' ')[0])}</h1><p>${esc(focus.description)}</p></div><button class="dx-create" onclick="navigate('${focus.route}')">${esc(focus.action)} →</button></div><div class="dx-scope"><div role="group" aria-label="Dashboard scope"><button class="dx-chip ${dxScope==='mine'?'on':''}" aria-pressed="${dxScope==='mine'}" onclick="dxSetScope('mine')">My work</button><button class="dx-chip ${dxScope==='shared'?'on':''}" aria-pressed="${dxScope==='shared'}" onclick="dxSetScope('shared')">Shared workspace</button></div><span>${esc(people[persona].team)} · Demo clock ${DX_TODAY}</span></div><div class="dx-kpis">${kpi('Active work items',all.length,'Cases + document review + intake')}${kpi('Active business cases',cases.length,'Within the selected scope')}${kpi('Document work',docs.length,'Verification and scan intake')}${kpi('Due today',today.length,'Using configured demo dates')}${kpi('Past due',overdue.length,'Not an SLA compliance measure')}</div><p class="dx-disclosure">${dxScope==='mine'?'My work uses the existing persona assignment rules.':'Shared workspace shows all demo teams; production access must follow approved entitlements.'} Charts summarize this scope; the filters below narrow only the worklist. No approved SLA calendar, pause policy or completion-timestamp metric is configured.</p><div class="dx-row2"><section class="dx-panel dx-chart"><div class="dx-ph"><div><h2>Active work by workflow family</h2><p class="sub">Four families · Tax Relief has new-business and termination variants</p></div></div>${dxMix(all)}</section><section class="dx-panel dx-chart"><div class="dx-ph"><div><h2>Active work by status</h2><p class="sub">Counts for the same selected scope</p></div>${dxStatus?'<button class="dx-btn" onclick="dxStatus=null;dxPage=0;render()">Clear status</button>':''}</div>${dxDonut(all)}</section></div><section class="dx-panel" id="dxWork"><div class="dx-ph"><div><h2>Active worklist</h2><p class="sub">Open a record to act. Expand to view illustrative process stages.</p></div><div class="dx-tools"><input type="search" aria-label="Search active work" placeholder="Search client, ID or workflow…" value="${esc(dxQuery)}" oninput="dxQuery=this.value;dxRefreshResults()"><button class="dx-btn" onclick="dxExpandAll()">Toggle stages on this page</button><button class="dx-btn" onclick="dxExport()">Export filtered work</button><div class="dx-pop"><button class="dx-btn" aria-expanded="${dxOpen==='cols'}" onclick="dxToggle('cols',event)">Columns</button>${dxOpen==='cols'?`<div class="dx-menu" onclick="event.stopPropagation()">${DX_COLS.map(([k,l])=>`<label><input type="checkbox" ${dxCols.has(k)?'checked':''} ${k==='wf'?'disabled':''} onchange="this.checked?dxCols.add('${k}'):dxCols.delete('${k}');document.getElementById('dxTable').innerHTML=dxTable()">${l}</label>`).join('')}</div>`:''}</div></div></div><div class="dx-views">${[['all','All active'],['today','Due today'],['overdue','Past due'],['review','Awaiting review']].map(([k,label])=>`<button class="dx-chip ${dxView===k?'on':''}" aria-pressed="${dxView===k}" onclick="dxView='${k}';dxPage=0;render()">${label}</button>`).join('')}<select aria-label="Workflow family" onchange="dxType=this.value;dxPage=0;render()"><option value="all">All workflow families</option>${Object.entries(DX_TYPES).map(([k,label])=>`<option value="${k}" ${dxType===k?'selected':''}>${label}</option>`).join('')}</select>${dxStatus?`<span>Status: ${esc(dxStatus)}</span>`:''}<button class="dx-btn" onclick="dxResetDashboard();render()">Clear filters</button></div><div id="dxTable">${dxTable()}</div></section>${dxTypeLists(all)}</div>`;
};
</script>
<script>render();
</script>
</body></html>
