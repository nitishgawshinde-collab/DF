/* Semantic status colors complement the red, black and gray brand palette. */
:root{--success:#23764b;--success-bg:#eff8f2;--success-line:#b8d9c4;--info:#245d8b;--info-bg:#edf4fa;--warning:#805b16;--warning-bg:#fff6e5;--error:#a32b35;--error-bg:#fceff0;--green:var(--success);--amber:var(--warning)}
.milestone-icon{display:inline-flex;align-items:center;justify-content:center;width:1.55em;height:1.55em;border-radius:50%;margin-right:4px;font-weight:800;vertical-align:middle;flex-shrink:0}
.milestone-icon.is-complete{color:var(--success);background:#dfefe4}
.milestone-icon.is-pending{color:#68717b;background:#edf0f3}
.milestone.done{border-color:var(--success-line);border-top:3px solid var(--success);background:var(--success-bg)}
.milestone.wait{border-color:#dce0e4;border-top:3px solid #a3adb6;background:#fafbfc}
.completion-tile.is-complete{border-color:var(--success-line);background:var(--success-bg)}
.completion-tile.is-pending{border-color:#dce0e4;background:#fafbfc}
.milestone b,.completion-tile b{color:var(--ink)}
.badge.green{color:var(--success);background:var(--success-bg)}
.badge.blue{color:var(--info);background:var(--info-bg)}
.badge.amber{color:var(--warning);background:var(--warning-bg)}
.badge.red{color:var(--error);background:var(--error-bg)}
.note.amber{color:var(--warning);background:var(--warning-bg);border-color:#c29137}
.note.green{color:var(--success);background:var(--success-bg);border-color:var(--success)}
input[type=checkbox]{accent-color:var(--success)}
@media(forced-colors:active){.milestone-icon{border:1px solid currentColor}.milestone.done,.completion-tile.is-complete{border:2px solid currentColor}}

<body>

<script>
'use strict';
/* React handoff: tokens above; data and policy below; service facade; independent view functions.
   Replace DemoService with Java APIs. Authorize and validate again on the server.
   No backend, Flowable, AG Grid Enterprise, legal e-signature or tax-law engine is connected.
   The evidence policy below is illustrative and intentionally identified as pending SME approval. */
const KEY='docuflow-tax-assessment-v2';
const people={fo:{name:'Alex Morgan',team:'Front Office',initials:'AM'},tax:{name:'Sophie Laurent',team:'Luxembourg Tax',initials:'SL'},scan:{name:'Claire Muller',team:'CDDM Luxembourg · Scan',initials:'CM'},input:{name:'Marta Kowalska',team:'CDDM Poland · Data Input',initials:'MK'},check:{name:'Piotr Nowak',team:'CDDM Poland · Data Check',initials:'PN'}};
const statusColor=s=>['Complete','Completed','Tax Approved','Fully Completed','Verified','Linked','Available','Active','Resolved'].includes(s)?'green':['Rejected','Overdue'].includes(s)?'red':['Returned','Returned for Correction','Account Pending','Incomplete','Waiting','Blocked / Waiting','Missing','Blocking'].includes(s)?'amber':['Under Tax Review','Implementation Pending','Data Check Pending','Processing','In Progress','In Remediation'].includes(s)?'blue':'';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=s=>`<span class="badge ${statusColor(s)}">${esc(s)}</span>`;
const icon=n=>{const paths={home:'M3 10 12 3l9 7v11H3V10 M9 21v-7h6v7',library:'M4 3h5v18H4z M12 3h5v18h-5z M19 5l2 15',cases:'M3 6h7l2 2h9v13H3z M3 6V3h7l2 3',docs:'M5 3h9l5 5v13H5z M14 3v6h5 M8 13h8 M8 17h6',archive:'M3 4h18v5H3z M5 9v12h14V9 M10 13h4',audit:'M12 3a9 9 0 1 0 9 9 M12 7v5l4 2 M16 3h5v5',integrations:'M4 4h5v5H4z M15 15h5v5h-5z M9 6h8v9 M6 9v8h9',rules:'M4 5h16 M4 12h16 M4 19h16 M8 3v4 M16 10v4 M10 17v4'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[n]||paths.cases}"/></svg>`};
const documentTypes=[['IDEN','Certified identification','Partner','Supporting evidence · demo code'],['BAEI','AEI self-certification','Partner','Single Tax Document Verification'],['BW8B','W-8BEN / W-8BEN-E','Partner','Single Tax Document Verification'],['BW9B','W-9 Certificate','Partner','Single Tax Document Verification'],['BCLN','Certificate of Loss of US Nationality','Partner','Single Tax Document Verification'],['BCRD','Residence certificate, Denmark','Account','Country-Specific Tax Documents'],['BPCR','Residence certificate, Poland','Account','Country-Specific Tax Documents']];
const countryCodes=['BCRD','BCRG','BCRN','BCRR','BCRS','BFCR','BICR','BITD','BNDS','BNOL','BPCR','BRPM','BTAG','BTAI','BTAS','BTAY','BTEI','BUAN'];
const answers=()=>({idValid:'Yes',address:'Yes',nationality:'Luxembourg',domicile:'Luxembourg',joint:'No',citizen:'No',multiple:'No',green:'No',birth:'No',resident:'No',presence:'No',usAddress:'No',phone:'No',transfer:'No',poa:'No',visa:'No',visaDetails:'',certified:false,signature:false});
function seed(){const clients=[{id:'P-48021',account:'LU-104782',name:'Elena Moreau',structure:'Individual',desk:'Private Clients · Luxembourg',advisor:'Alex Morgan',exists:true},{id:'P-48022',account:'LU-104793',name:'Julian Hartmann',structure:'Individual',desk:'International Clients',advisor:'Alex Morgan',exists:false},{id:'P-48023',account:'LU-104806',name:'Sofia Lindberg',structure:'Individual',desk:'Private Clients · Luxembourg',advisor:'Alex Morgan',exists:true},{id:'P-48024',account:'LU-104815',name:'Gabriel Fischer',structure:'Individual',desk:'International Clients',advisor:'Alex Morgan',exists:true}];const stages=['Under Tax Review','Account Pending','Returned','Completed'];const s={clients,cases:[],docs:[],audit:[],seq:1100};clients.forEach((cl,i)=>{const cid=`BCTS-2026-${1041+i}`,a=answers();a.certified=true;a.signature=true;const c={id:cid,client:cl.id,status:stages[i],archived:i===3,context:i===1?'Onboarding dependency':'Independent assessment',created:'2026-09-23',due:i===2?'2026-09-22':'2026-09-25',answers:a,evidence:[],assessment:{country:'LU',blocking:'No restriction · demo',fiscal:'2026',reporting:'Standard · demo',fatca:'Pending SME mapping',treatment:'Per approved instruction',rationale:i===0?'':'Reviewed against the linked demonstration evidence.'},taxApproved:i===1||i===3,inputBy:i===3?'input':null,checkBy:i===3?'check':null,deficiencies:i===2?[{id:'DEF-001',reason:'Missing evidence',comment:'Please reconfirm that the identification copy is certified and record the signature check.',owner:'Front Office',severity:'Blocking',resolved:false}]:[],obsReference:i===3?'OBS-DEMO-7241':'',instructions:i===3?'Apply the approved tax instructions.':'',approvalSnapshot:null};if(i===2){a.certified=false;a.signature=false;}['IDEN','BAEI'].forEach((code,j)=>{const d={id:`DOC-${260100+i*10+j}`,client:cl.id,owner:'Partner',code,name:code==='IDEN'?'Certified identification.pdf':'AEI self-certification.pdf',subtype:code==='BAEI'?'Natural / controlling person':'',format:'Copy Valid as Original',status:'Complete',validFrom:'2026-01-01',validTo:'2027-12-31',source:'Hive · seeded demo',signature:true,custody:'',predecessor:null,version:1,uploaded:'2026-09-21',uploader:'Claire Muller'};s.docs.push(d);c.evidence.push(d.id);});s.cases.push(c);s.audit.push({caseId:cid,at:'2026-09-23T08:30:00Z',actor:'Demo seed',action:'Assessment loaded',detail:`${stages[i]} · fictional record`});});s.docs.push({id:'DOC-260090',client:'P-48021',owner:'Partner',code:'BAEI',name:'AEI self-certification — previous.pdf',subtype:'Natural / controlling person',format:'Digital Original',status:'Replaced',validFrom:'2025-01-01',validTo:'2025-12-31',source:'Hive · seeded demo',signature:true,predecessor:null,successor:'DOC-260101',version:1,uploaded:'2025-01-01',uploader:'Alex Morgan'});s.docs.find(d=>d.id==='DOC-260101').predecessor='DOC-260090';s.docs.find(d=>d.id==='DOC-260101').version=2;return s;}
let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed();if(!data.cases||!data.docs)throw Error();}catch(e){data=seed();}
let page='overview',persona='fo',current=null,tab='overview',filter='All',query='',sortAsc=true,docFilter='All',files=new Map(),lastFocus=null;
const clientOf=c=>data.clients.find(x=>x.id===c.client);
const selected=()=>data.cases.find(c=>c.id===current);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){toast('Browser storage unavailable. Changes remain in this tab only.');}}
function log(action,detail,caseId=current){data.audit.unshift({caseId:caseId||'Workspace',at:new Date().toISOString(),actor:`${people[persona].name} · ${people[persona].team}`,action,detail});persist();}
const DemoService={createCase(client,context){const id=`BCTS-2026-${++data.seq+1000}`;data.cases.unshift({id,client,status:'Draft',context,archived:false,created:new Date().toISOString().slice(0,10),due:'2026-09-30',answers:answers(),evidence:[],assessment:{},taxApproved:false,deficiencies:[],inputBy:null,checkBy:null});return id;},save:persist};
function toast(t){const el=document.getElementById('toast');el.className='toast';el.textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{el.className='';el.textContent='';},5500);}
function switchRole(v){persona=v;render();toast(`Demo persona: ${people[v].team}`);}
const navItems=[['overview','home','Overview'],['library','library','Process library'],['cases','cases','Assessments'],['tasks','cases','My tasks'],['documents','docs','File cabinets'],['archive','archive','Archival'],['audit','audit','Audit trail'],['integrations','integrations','Integrations'],['decisions','rules','Scope & decisions']];
function navigate(p){page=p;query='';filter='All';current=null;document.getElementById('sidebar').classList.remove('open');render();window.scrollTo(0,0);}
function openCase(id){current=id;page='detail';tab='overview';render();window.scrollTo(0,0);}
function roleOwner(c){if(c.status==='Under Tax Review')return 'tax';if(c.status==='Implementation Pending')return 'input';if(c.status==='Data Check Pending')return 'check';if(['Draft','Returned'].includes(c.status))return 'fo';return null;}
function taskState(c){return ({Draft:'Draft',Returned:'Returned for Correction','Account Pending':'Blocked / Waiting',Completed:'Completed',Rejected:'Completed'})[c.status]||'In Progress';}
function processState(c){return ({Draft:'Draft',Returned:'Returned',Completed:'Completed',Rejected:'Rejected'})[c.status]||'Processing';}
function canEdit(c){return persona==='fo'&&!c.archived&&['Draft','Returned'].includes(c.status);}
function render(){document.getElementById('nav').innerHTML=navItems.map(([p,i,t])=>`<button class="${page===p||(page==='detail'&&p==='cases')?'active':''}" onclick="navigate('${p}')">${icon(i)}${t}${p==='tasks'?`<span class="pillcount">${data.cases.filter(c=>!c.archived&&roleOwner(c)===persona).length}</span>`:''}</button>`).join('');document.getElementById('role').innerHTML=Object.entries(people).map(([k,v])=>`<option value="${k}" ${persona===k?'selected':''}>${v.name} · ${v.team}</option>`).join('');document.getElementById('avatar').textContent=people[persona].initials;document.getElementById('breadcrumb').textContent=page==='detail'?current:navItems.find(x=>x[0]===page)?.[2]||'';const views={overview:overviewView,library:libraryView,cases:casesView,tasks:tasksView,documents:documentsView,archive:archiveView,audit:auditView,integrations:integrationsView,decisions:decisionsView,detail:detailView};document.getElementById('main').innerHTML=views[page]();}
function heading(k,t,s,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p class="subtitle">${s}</p></div><div class="actions">${actions}</div></div>`;}
function newButton(){return `<button class="primary" onclick="newCaseDialog()" ${persona!=='fo'?'disabled title="Switch to Front Office to initiate an assessment"':''}>＋ New assessment</button>`;}
function overviewView(){const active=data.cases.filter(c=>!c.archived&&!['Completed','Rejected'].includes(c.status));const review=active.filter(c=>c.status==='Under Tax Review').length,returned=active.filter(c=>c.status==='Returned').length,waiting=active.filter(c=>c.status==='Account Pending').length;const groups=[['Tax review',review,'#b5121b'],['Correction',returned,'#8c8d90'],['Account pending',waiting,'#b7b5ac'],['Other active',active.length-review-returned-waiting,'#34363a']];return heading('Client tax operations',`Welcome, ${people[persona].name.split(' ')[0]}`, 'Your document, assessment, and implementation work in one place.',newButton())+`<div class="cards"><div class="card"><div class="label">Active assessments</div><strong>${active.length.toString().padStart(2,'0')}</strong><span class="caption">Across all operational teams</span></div><div class="card"><div class="label">Awaiting Tax review</div><strong>${review.toString().padStart(2,'0')}</strong><span class="caption">Ready for substantive assessment</span></div><div class="card"><div class="label">Returned for correction</div><strong class="accent">${returned.toString().padStart(2,'0')}</strong><span class="caption">Structured feedback to resolve</span></div><div class="card"><div class="label">Account dependencies</div><strong>${waiting.toString().padStart(2,'0')}</strong><span class="caption">Tax approved · awaiting account</span></div></div><div class="two-col"><section class="panel"><div class="panelhead"><div><h2>Assessment pipeline</h2><p>Live counts from this demonstration workspace</p></div>${badge('BCTS')}</div><div class="panelbody"><div class="pipeline">${groups.filter(g=>g[1]).map(g=>`<span style="flex:${g[1]};background:${g[2]}"></span>`).join('')}</div><div class="legend">${groups.map(g=>`<div><span><i style="background:${g[2]}"></i>${g[0]}</span><b>${g[1]}</b></div>`).join('')}</div><div class="note">Document completion, Tax approval, account availability, and OBS implementation remain separate milestones.</div></div></section><section class="panel"><div class="panelhead"><div><h2>Focus for today</h2><p>Dependencies and actions requiring attention</p></div></div><div class="panelbody"><div class="queue"><div><h3>Resolve returned assessments</h3><p>${returned} awaiting Front Office correction</p></div><button class="small" onclick="navigate('cases');setFilter('Returned')">Review →</button></div><div class="queue"><div><h3>Account availability</h3><p>${waiting} approved assessment waiting for OBS</p></div><button class="small" onclick="navigate('integrations')">Inspect →</button></div><div class="queue"><div><h3>Business decisions</h3><p>Evidence policy and sign-off rules remain open</p></div><button class="small" onclick="navigate('decisions')">View →</button></div></div></section></div>`+casePanel(data.cases.filter(c=>!c.archived),'Assessments & workflows')+`<div class="footerhint">Demonstration date: September 23, 2026 · Dates and records are illustrative. No real tax advice or automated tax determination.</div>`;}
function casePanel(rows,title){return `<section class="panel"><div class="panelhead"><div><h2>${title}</h2><p>Open an assessment to see its evidence, decisions, and implementation history.</p></div><button class="small" onclick="exportCases()">↓ Export CSV</button></div><div class="toolbar"><div class="filters">${['All','Draft','Under Tax Review','Returned','Account Pending','Completed'].map(s=>`<button class="chip ${filter===s?'active':''}" onclick="setFilter('${s}')">${s==='Under Tax Review'?'Tax review':s}</button>`).join('')}</div><label class="search"><input aria-label="Search assessments" placeholder="Search client or assessment…" value="${esc(query)}" oninput="query=this.value;refreshRows()"></label></div><div class="tablewrap"><table><thead><tr><th><button class="quiet small" onclick="sortAsc=!sortAsc;refreshRows()">Client / assessment ↕</button></th><th>Current stage</th><th>Responsible team</th><th>Evidence</th><th>Due date</th><th>Context</th></tr></thead><tbody id="caseRows">${caseRows(rows)}</tbody></table></div><div class="tablefoot"><span id="caseCount">${filtered(rows).length} assessments</span><span>All sample records · page 1 of 1</span></div></section>`;}
function filtered(rows){return rows.filter(c=>(filter==='All'||c.status===filter)&&`${c.id} ${clientOf(c).name} ${clientOf(c).account}`.toLowerCase().includes(query.toLowerCase())).sort((a,b)=>clientOf(a).name.localeCompare(clientOf(b).name)*(sortAsc?1:-1));}
function caseRows(rows){return filtered(rows).map(c=>{const cl=clientOf(c),owner=roleOwner(c);return `<tr><td><button class="linkbtn" onclick="openCase('${c.id}')"><b>${esc(cl.name)}</b><small>${c.id} · ${cl.account}</small></button></td><td>${badge(c.status)}${c.archived?'<small>Archived · read-only</small>':''}</td><td>${owner?people[owner].team:c.status==='Account Pending'?'System · account event':'—'}<small>${owner?people[owner].name:'No active human task'}</small></td><td>${c.evidence.length} linked<small>${missing(c).length?`${missing(c).length} sample requirement(s) unmet`:'Sample evidence gate satisfied'}</small></td><td>${esc(c.due)}${c.due<'2026-09-23'&&!['Completed','Rejected'].includes(c.status)?'<small style="color:var(--red)">Overdue · demo clock</small>':''}</td><td>${esc(c.context)}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No assessments match this view.</td></tr>';}
function rowsForPage(){if(page==='archive')return data.cases.filter(c=>c.archived);if(page==='tasks')return data.cases.filter(c=>!c.archived&&roleOwner(c)===persona);return data.cases.filter(c=>!c.archived);}
function refreshRows(){document.getElementById('caseRows').innerHTML=caseRows(rowsForPage());document.getElementById('caseCount').textContent=filtered(rowsForPage()).length+' assessments';}
function setFilter(f){filter=f;render();}
function casesView(){return heading('Business processes','Account tax assessments','BCTS assessments initiated independently or linked to onboarding.',newButton())+casePanel(rowsForPage(),'Assessment register');}
function tasksView(){return heading('Role workspace','My tasks',`${esc(people[persona].team)} · ${esc(people[persona].name)}. Switch the demo persona to explore another team’s queue.`)+casePanel(rowsForPage(),'Assigned work');}
function archiveView(){return heading('Workspace / archival','Archived assessments','Completed cases retained with their linked evidence and full audit history.')+`<div class="note">Archival is an explicit demonstration action after completion. Retention periods, legal holds, and restore permissions require a separate business policy.</div>`+casePanel(rowsForPage(),'Completed & archived');}
function libraryView(){return heading('Business process library','Start with a business outcome','A shared workspace that can grow as new workflow requirements are approved.')+`<div class="librarycards"><article class="processcard live"><div class="tag">TAX · CHECKLIST</div><h2>Account Tax Assessment</h2><p>Complete BCTS, reuse verified evidence, obtain Tax approval, and track OBS implementation.</p><div class="actions">${badge('Available in prototype')}</div><br>${newButton()}</article><article class="processcard"><div class="tag">TAX · FUTURE SCOPE</div><h2>Tax Relief at Source</h2><p>New Business and Termination are captured in the requirements but are outside this BCTS prototype.</p><button onclick="navigate('decisions')">View scope decision →</button></article><article class="processcard"><div class="tag">PLATFORM · EXTENSIBILITY</div><h2>Future business processes</h2><p>Add approved workflows to the same document, task, access, and audit capabilities.</p><span class="badge">Requirements first</span></article></div><div class="note">Document verification starts automatically after an eligible upload. It is not a manually selected process in this library.</div>`;}
function newCaseDialog(){if(persona!=='fo')return toast('Switch to Front Office to create an assessment.');showModal('New account tax assessment',`<form id="newForm" onsubmit="event.preventDefault();createCase()"><div class="note">BCTS · Individual clients only in this demonstration. Entity-specific checklist rules have not been supplied.</div><div class="formgrid"><label class="field full">Client / Partner<select id="newClient">${data.clients.map(c=>`<option value="${c.id}">${esc(c.name)} · ${c.id} · ${c.account}</option>`).join('')}</select><span class="hint">Fictional iCRM reference records.</span></label><label class="field full">Assessment context<select id="newContext"><option>Independent assessment</option><option>Onboarding dependency</option></select><span class="hint">Onboarding is a dependency only; no assumed account-opening workflow is included.</span></label></div><div class="formactions"><button type="submit" class="primary">Create draft</button><button type="button" onclick="closeModal()">Cancel</button></div></form>`);}
function createCase(){const id=DemoService.createCase(document.getElementById('newClient').value,document.getElementById('newContext').value);current=id;log('Draft created','BCTS demonstration checklist · policy DEMO-BCTS-02');closeModal();openCase(id);tab='checklist';render();toast('Draft created. Complete the checklist, then link eligible evidence.');}
function missing(c){const a=c.answers,req=[{code:'IDEN',title:'Certified identification'},{code:'BAEI',title:'AEI self-certification'}];if(a.citizen==='Yes'||a.green==='Yes'||a.resident==='Yes'||a.presence==='Yes')req.push({code:'BW9B',title:'W-9 Certificate'});else if(['birth','usAddress','phone','transfer','poa'].some(k=>a[k]==='Yes'))req.push({code:'BW8B',title:'W-8BEN supporting review'});return req.filter(r=>!c.evidence.some(id=>{const d=data.docs.find(x=>x.id===id);return d&&d.code===r.code&&eligible(d,c)}));}
function requirements(c){const copy={...c,evidence:[]};return missing(copy);}
function eligible(d,c){return d.client===c.client&&d.status==='Complete'&&(!d.validFrom||d.validFrom<='2026-09-23')&&(!d.validTo||d.validTo>='2026-09-23');}
function detailView(){const c=selected(),cl=clientOf(c);return heading(`Tax / Account assessment / ${c.id}`,esc(cl.name),`${cl.account} &nbsp; · &nbsp; ${cl.id} &nbsp; · &nbsp; ${esc(c.context)}`,`<button onclick="navigate('${c.archived?'archive':'cases'}')">← Register</button>${badge(c.status)}${c.status==='Completed'&&!c.archived?'<button onclick="archiveCase()">Archive assessment</button>':''}`)+`${c.archived?'<div class="note">Archived record · read-only. Decisions and linked evidence remain traceable.</div>':''}<div class="tabs" role="tablist">${[['overview','Overview'],['checklist','BCTS checklist'],['evidence',`Evidence (${c.evidence.length})`],['assessment','Tax & implementation'],['history','Audit history']].map(([k,t])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?'active':''}" onclick="tab='${k}';render()">${t}</button>`).join('')}</div><div class="detail-grid"><div>${({overview:caseOverview,checklist:checklistView,evidence:evidenceView,assessment:assessmentView,history:historyView}[tab])(c)}</div><aside><section class="panel"><div class="panelhead"><h2>Case context</h2></div><div class="panelbody"><div class="summary-list"><div><span>Process state</span>${badge(processState(c))}</div><div><span>Task state</span>${badge(taskState(c))}</div><div><span>Client type</span><b>${cl.structure}</b></div><div><span>Client advisor</span><b>${esc(cl.advisor)}</b></div><div><span>Source context</span><b>iCRM · demo</b></div><div><span>OBS account</span>${badge(cl.exists?'Available':'Pending')}</div><div><span>Due date</span><b>${c.due}</b></div><div><span>Current owner</span><b>${roleOwner(c)?people[roleOwner(c)].name:'System / closed'}</b></div></div><p style="font-size:13px;margin-top:15px">${esc(cl.desk)}</p></div></section><div class="note">Evidence policy <b>DEMO-BCTS-02</b><br>Illustrative mappings for business review. The exact mandatory categories await Tax SME approval.</div><button style="width:100%" onclick="guideDialog()">How to explore this prototype</button></aside></div>`;}
function caseOverview(c){const cl=clientOf(c),docdone=missing(c).length===0;return `<section class="panel"><div class="panelhead"><div><h2>Independent milestones</h2><p>Each outcome is tracked separately.</p></div></div><div class="panelbody"><div class="milestones">${[[docdone,'Documents',docdone?'Sample gate satisfied':'Evidence outstanding'],[c.taxApproved,'Tax approval',c.taxApproved?'Approved':'Pending review'],[cl.exists,'Account',cl.exists?'Available in OBS':'Account pending'],[c.status==='Completed','Implementation',c.status==='Completed'?'Input & check complete':c.status==='Data Check Pending'?'Awaiting data check':'Pending']].map(([done,t,s])=>`<div class="milestone ${done?'done':'wait'}"><b><span class="milestone-icon ${done?'is-complete':'is-pending'}" aria-hidden="true">${done?'✓':'○'}</span> ${t}</b><small>${s}</small></div>`).join('')}</div>${c.status==='Account Pending'?'<div class="note amber">Tax is approved. OBS implementation is waiting for account availability. Use Integrations to simulate the Account Created event.</div>':''}<h3>Next action</h3><p>${nextText(c)}</p><div class="actions" style="margin-top:20px"><button class="primary" onclick="tab='${canEdit(c)?'checklist':'assessment'}';render()">${canEdit(c)?'Continue checklist':'View decision & implementation'} →</button><button onclick="tab='evidence';render()">Review evidence</button></div></div></section>${deficiencyPanel(c)}<section class="panel" style="margin-top:20px"><div class="panelhead"><h2>Recent activity</h2></div><div class="panelbody">${timeline(data.audit.filter(e=>e.caseId===c.id).slice(0,3))}</div></section>`;}
function nextText(c){const m={Draft:'Front Office completes the checklist and links eligible evidence before submission.',Returned:'Front Office corrects the same request, resolves the blocking deficiency, and resubmits.', 'Under Tax Review':'Luxembourg Tax assesses the evidence and records a reasoned approval, return, or rejection.','Account Pending':'Await the simulated Account Created event; approval does not imply implementation.','Implementation Pending':'CDDM Data Input records the OBS implementation reference and instructions applied.','Data Check Pending':'A different CDDM user verifies the entered data against the approved instruction.',Completed:'Assessment completed. The record can be archived while retaining the decision and evidence history.',Rejected:'Assessment rejected. This record remains available for audit.'};return m[c.status]||'';}
function deficiencyPanel(c){if(!c.deficiencies.length)return '';return `<section class="panel" style="margin-top:20px"><div class="panelhead"><h2>Deficiencies & returns</h2></div><div class="panelbody">${c.deficiencies.map((d,i)=>`<div class="evidence"><div><b>${esc(d.reason)}</b> ${badge(d.resolved?'Resolved':'Blocking')}<p>${esc(d.comment)}</p><p>${esc(d.owner)} · ${esc(d.severity)} · ${d.id}</p></div>${!d.resolved&&canEdit(c)?`<button class="small" onclick="resolveDeficiency(${i})">Record resolution</button>`:''}</div>`).join('')}</div></section>`;}
function yn(name,label,a,hint=''){return `<label class="field">${label}<select name="${name}">${['No','Yes'].map(v=>`<option ${a[name]===v?'selected':''}>${v}</option>`).join('')}</select>${hint?`<span class="hint">${hint}</span>`:''}</label>`;}
function checklistView(c){const a=c.answers,edit=canEdit(c);return `<section class="panel"><div class="panelhead"><div><h2>Front Office checklist</h2><p>Structured questions · save and resume · role-controlled completion</p></div>${badge(edit?'Editable':'Read-only')}</div><div class="panelbody"><div class="note">Sample policy only. These five question sections are not the five mandatory document categories, which remain unconfirmed. Evidence requirements update when you save.</div><form id="checklistForm" onsubmit="event.preventDefault();saveChecklist(false)"><fieldset ${!edit?'disabled':''}><div class="section"><div class="section-title"><span class="number">01</span><h3>Identification & client context</h3></div><div class="formgrid"><label class="field">Nationality<input name="nationality" value="${esc(a.nationality)}" required></label><label class="field">Domicile / tax residence<input name="domicile" value="${esc(a.domicile)}" required></label>${yn('idValid','Identification is valid',a)}${yn('address','Complete address confirmed',a)}${yn('joint','Joint-account context',a,'Joint-account ownership and evidence rules require SME confirmation.')}</div></div><div class="section"><div class="section-title"><span class="number">02</span><h3>U.S. nationality</h3></div><div class="formgrid">${yn('citizen','U.S. citizenship',a)}${yn('multiple','Multiple citizenship',a)}${yn('green','Green Card',a)}${yn('birth','U.S. place of birth',a)}</div></div><div class="section"><div class="section-title"><span class="number">03</span><h3>U.S. residency</h3></div><div class="formgrid">${yn('resident','Residence in the U.S.',a)}${yn('presence','Substantial-presence outcome requires review',a,'Outcome recorded for demonstration; no legal day-count calculation is implemented.')}</div></div><div class="section"><div class="section-title"><span class="number">04</span><h3>U.S. indicia</h3></div><div class="formgrid">${yn('usAddress','U.S. address',a)}${yn('phone','U.S. telephone',a)}${yn('transfer','U.S. transfer instruction',a)}${yn('poa','Power of attorney with U.S. address',a)}</div></div><div class="section"><div class="section-title"><span class="number">05</span><h3>U.S. visa & confirmations</h3></div><div class="formgrid">${yn('visa','U.S. visa / dependent status applies',a)}<label class="field">Visa category / supporting evidence note<input name="visaDetails" value="${esc(a.visaDetails)}" placeholder="Required if visa applies"></label></div><label class="checkrow"><input type="checkbox" name="certified" ${a.certified?'checked':''}> I confirm ownership and certified identification evidence for this demonstration.</label><label class="checkrow"><input type="checkbox" name="signature" ${a.signature?'checked':''}> I recorded the initial signature check. This is a verification attestation, not an electronic signature.</label></div><div class="formactions"><button type="submit">Save checklist</button><button type="button" class="primary" onclick="saveChecklist(true)">Save & review evidence →</button></div></fieldset></form>${!edit?`<div class="note">${c.archived?'Archived assessment.':'Editable only by Front Office while Draft or Returned.'} Switch the demo persona when appropriate.</div>`:''}</div></section>`;}
function saveChecklist(next){const c=selected();if(!canEdit(c))return;const form=document.getElementById('checklistForm');if(!form.reportValidity())return;const f=new FormData(form);for(const k of Object.keys(c.answers))c.answers[k]=['certified','signature'].includes(k)?f.has(k):f.get(k)||'';log('Checklist saved','Answers captured under policy DEMO-BCTS-02');if(next)tab='evidence';render();toast('Checklist saved. Conditional sample evidence requirements updated.');}
function evidenceView(c){const m=missing(c);return `<section class="panel"><div class="panelhead"><div><h2>Supporting evidence</h2><p>Reuse by Document ID · only complete, valid evidence is selectable</p></div>${canEdit(c)?'<button onclick="uploadDialog()">＋ Upload evidence</button>':''}</div><div class="panelbody"><div class="note">DEMO-BCTS-02 illustrates five distinct evidence categories. Selected U.S. answers add conditional evidence. The category-to-document mapping is a prototype assumption. This is an illustrative review gate, not the approved tax evidence matrix.</div>${requirements(c).map(r=>`<div class="evidence"><div><b>${r.title}</b><p>${r.code==='IDEN'?'IDEN is a prototype-only code':r.code} · ${m.some(x=>x.code===r.code)?'Eligible document not yet linked':'Linked document satisfies sample requirement'}</p></div><div class="actions">${badge(m.some(x=>x.code===r.code)?'Missing':'Linked')}${canEdit(c)?`<button class="small" onclick="linkDialog('${r.code}')">Select evidence</button>`:''}</div></div>`).join('')}<h3 style="margin-top:25px">Linked document records</h3>${c.evidence.map(id=>{const d=data.docs.find(x=>x.id===id);if(!d)return '';return `<div class="queue"><div><button class="linkbtn" onclick="documentDialog('${d.id}')"><b>${esc(d.name)}</b></button><p>${d.id} · ${d.code} · ${d.format} · ${badge(d.status)}</p>${!eligible(d,c)?'<p class="danger">No longer eligible for the current evidence gate.</p>':''}</div>${canEdit(c)?`<button class="quiet small danger" onclick="unlinkDoc('${d.id}')">Unlink</button>`:''}</div>`}).join('')||'<p>No documents linked yet.</p>'}<div class="formactions">${canEdit(c)?'<button class="primary" onclick="submitAssessment()">Submit to Tax review →</button>':'<span class="muted">Evidence changes are locked after submission.</span>'}</div><p style="font-size:13px;margin-top:12px">Submission also checks the checklist confirmations and unresolved deficiencies.</p></div></section>${deficiencyPanel(c)}`;}
function linkDialog(code){const c=selected();if(!canEdit(c))return;const docs=data.docs.filter(d=>d.client===c.client&&d.code===code);showModal('Select reusable evidence',`<p>Matching client ownership and document type. Rejected, replaced, incomplete, or expired evidence cannot be linked.</p>${docs.map(d=>`<div class="evidence"><div><b>${esc(d.name)}</b><p>${d.id} · valid to ${d.validTo||'Not specified'}</p>${badge(d.status)}</div><button ${!eligible(d,c)?'disabled':''} onclick="linkDoc('${d.id}')">${c.evidence.includes(d.id)?'Already linked':'Link document'}</button></div>`).join('')||'<div class="empty">No matching document is available. Upload evidence and complete verification first.</div>'}`);}
function linkDoc(id){const c=selected(),d=data.docs.find(x=>x.id===id);if(!canEdit(c)||!eligible(d,c))return toast('This evidence is not eligible.');if(!c.evidence.includes(id)){c.evidence.push(id);log('Evidence linked',`${id} · ${d.code}`);}closeModal();render();}
function unlinkDoc(id){const c=selected();if(!canEdit(c))return;c.evidence=c.evidence.filter(x=>x!==id);log('Evidence unlinked',id);render();}
function submitAssessment(){const c=selected();if(!canEdit(c))return;const a=c.answers;if(!a.certified||!a.signature||a.idValid!=='Yes'||a.address!=='Yes'||!a.nationality.trim()||!a.domicile.trim())return toast('Complete identification, address, and both Front Office confirmations in the checklist.');if(a.visa==='Yes'&&!a.visaDetails.trim())return toast('Record the visa category and supporting-evidence note in the checklist.');if(missing(c).length)return toast('Submission blocked: link all evidence required by the sample policy.');if(c.deficiencies.some(d=>!d.resolved))return toast('Resolve the blocking deficiency before resubmitting.');c.status='Under Tax Review';log('Assessment submitted','Front Office → Luxembourg Tax · sample evidence gate satisfied');tab='assessment';render();toast('Submitted. Switch to Luxembourg Tax to review and decide.');}
function assessmentView(c){const cl=clientOf(c),canTax=persona==='tax'&&c.status==='Under Tax Review'&&!c.archived;return `<section class="panel"><div class="panelhead"><div><h2>Luxembourg Tax assessment</h2><p>Structured decision and implementation instructions</p></div>${badge(c.taxApproved?'Tax Approved':'Pending')}</div><div class="panelbody"><div class="note">Operational field groups follow the supplied requirements. Codes, allowed values, and detailed mappings are placeholders pending Tax SME validation.</div><form id="taxForm" onsubmit="event.preventDefault();taxApprove()"><fieldset ${!canTax?'disabled':''}><div class="formgrid"><label class="field">KS001 · Tax country<input name="country" required value="${esc(c.assessment.country||'')}" placeholder="e.g., LU · demo"></label><label class="field">KS001 · Securities blocking instruction<input name="blocking" required value="${esc(c.assessment.blocking||'')}" placeholder="Record the reviewed instruction"></label><label class="field">KS001 · Fiscal-year range<input name="fiscal" required value="${esc(c.assessment.fiscal||'')}" placeholder="e.g., 2026"></label><label class="field">KS013 · Reporting group / fee instruction<input name="reporting" required value="${esc(c.assessment.reporting||'')}" placeholder="SME-defined values pending"></label><label class="field">KT009U · FATCA / GIIN / UK tax instruction<input name="fatca" required value="${esc(c.assessment.fatca||'')}" placeholder="Structured mapping pending"></label><label class="field">WT002 · Market treatment / relief instruction<input name="treatment" required value="${esc(c.assessment.treatment||'')}" placeholder="Country-specific mapping pending"></label><label class="field full">Decision rationale & implementation instructions<textarea name="rationale" required placeholder="Explain the decision and instruction for CDDM">${esc(c.assessment.rationale||'')}</textarea></label></div><div class="note">KS010: linked evidence provides verification status and form validity. KT075 / KS039J: detailed information, U.S. person, operating-company, blocking, and contact mappings remain open.</div><div class="formactions"><button type="submit" class="primary">Approve Tax assessment</button><button type="button" onclick="returnDialog('return')">Return for correction</button><button type="button" class="danger" onclick="returnDialog('reject')">Reject</button></div></fieldset></form>${!canTax?`<p style="font-size:13px">${c.taxApproved?'Tax decision recorded.':'Switch to Luxembourg Tax when this case is Under Tax Review.'}</p>`:''}</div></section><section class="panel" style="margin-top:20px"><div class="panelhead"><div><h2>OBS implementation</h2><p>Approval → account availability → data input → independent check</p></div>${badge(c.status==='Completed'?'Completed':c.status==='Data Check Pending'?'Data Check Pending':'Pending')}</div><div class="panelbody">${!cl.exists?'<div class="note amber">Account pending. Implementation is blocked until Account Created is received. <button class="small" onclick="navigate(\'integrations\')">View dependency</button></div>':''}<div class="summary-list"><div><span>Data input by</span><b>${c.inputBy?people[c.inputBy].name:'Pending'}</b></div><div><span>Data checked by</span><b>${c.checkBy?people[c.checkBy].name:'Pending'}</b></div><div><span>OBS reference</span><b>${esc(c.obsReference||'Pending')}</b></div></div>${persona==='input'&&c.status==='Implementation Pending'&&!c.archived?`<form id="inputForm" onsubmit="event.preventDefault();recordInput()"><div class="formgrid" style="margin-top:20px"><label class="field full">OBS implementation reference<input name="reference" required placeholder="OBS-DEMO-…"></label><label class="field full">Data input confirmation<textarea name="instructions" required placeholder="Record the instruction applied and reconciliation details"></textarea></label></div><div class="formactions"><button class="primary" type="submit">Record data input</button><button type="button" onclick="returnDialog('tax')">Return to Tax</button></div></form>`:''}${persona==='check'&&c.status==='Data Check Pending'&&!c.archived?`<div class="note">Input recorded: ${esc(c.instructions)}</div><label class="checkrow"><input type="checkbox" id="checkedObs"> I checked the OBS values against the approved Tax instruction.</label><div class="actions"><button class="primary" onclick="completeCase()">Confirm check & complete</button><button onclick="returnDialog('input')">Return to Data Input</button></div>`:''}<p style="font-size:13px;margin-top:15px">Maker-checker separation is enforced in this demo; final business authorization rules remain to be confirmed.</p></div></section>${deficiencyPanel(c)}`;}
function taxApprove(){const c=selected();if(persona!=='tax'||c.status!=='Under Tax Review'||c.archived)return;const f=document.getElementById('taxForm');if(!f.reportValidity())return;if(missing(c).length)return toast('Approval blocked: linked evidence is missing or no longer eligible. Return the case for correction.');c.assessment=Object.fromEntries(new FormData(f));if(Object.values(c.assessment).some(v=>!v.trim()))return toast('Provide meaningful values in each required assessment field.');c.taxApproved=true;c.approvalSnapshot={evidence:[...c.evidence],rule:'DEMO-BCTS-02',at:new Date().toISOString(),actor:people[persona].name};c.status=clientOf(c).exists?'Implementation Pending':'Account Pending';log('Tax Approved',`Decision: ${c.assessment.rationale}. Next: ${c.status}. Evidence: ${c.evidence.join(', ')}`);render();toast('Tax approval recorded separately from OBS implementation.');}
function returnDialog(kind){const c=selected();const allowed=(['return','reject'].includes(kind)&&persona==='tax'&&c.status==='Under Tax Review')||(kind==='tax'&&persona==='input'&&c.status==='Implementation Pending')||(kind==='input'&&persona==='check'&&c.status==='Data Check Pending');if(!allowed||c.archived)return;showModal(kind==='reject'?'Reject assessment':'Return with structured feedback',`<form id="returnForm" onsubmit="event.preventDefault();applyReturn('${kind}')"><div class="formgrid"><label class="field full">Reason code<select name="reason"><option>Missing evidence</option><option>Inconsistent information</option><option>Signature verification issue</option><option>Implementation mismatch</option><option>Tax decision clarification</option></select></label><label class="field full">Required comment<textarea name="comment" required placeholder="Describe the issue and the correction required"></textarea></label></div><div class="formactions"><button type="submit" class="primary">${kind==='reject'?'Confirm rejection':'Return work'}</button><button type="button" onclick="closeModal()">Cancel</button></div></form>`);}
function applyReturn(kind){const c=selected(),f=document.getElementById('returnForm');if(!f.reportValidity())return;const vals=Object.fromEntries(new FormData(f));if(!vals.comment.trim())return toast('A meaningful comment is required.');if(kind==='tax'){c.status='Under Tax Review';c.taxApproved=false;c.inputBy=null;}else if(kind==='input'){c.status='Implementation Pending';c.inputBy=null;}else{c.status=kind==='reject'?'Rejected':'Returned';c.taxApproved=false;}if(kind==='return')c.deficiencies.push({id:'DEF-'+(++data.seq),...vals,owner:'Front Office',severity:'Blocking',resolved:false});log(kind==='reject'?'Assessment rejected':'Work returned',`${vals.reason}: ${vals.comment}. Target: ${c.status}`);closeModal();render();}
function resolveDeficiency(i){showModal('Record deficiency resolution',`<form onsubmit="event.preventDefault();saveResolution(${i})"><label class="field">Resolution evidence / correction<textarea id="resolution" required placeholder="What was corrected and which evidence supports it?"></textarea></label><div class="formactions"><button class="primary">Record resolution</button></div></form>`);}
function saveResolution(i){const c=selected(),v=document.getElementById('resolution').value.trim();if(!canEdit(c)||!v)return;c.deficiencies[i].resolved=true;c.deficiencies[i].resolution=v;log('Deficiency resolved',`${c.deficiencies[i].id}: ${v}`);closeModal();render();}
function recordInput(){const c=selected();if(persona!=='input'||c.status!=='Implementation Pending'||!c.taxApproved||!clientOf(c).exists||c.archived)return;const f=document.getElementById('inputForm');if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f));if(!v.reference.trim()||!v.instructions.trim())return toast('Enter the OBS reference and implementation details.');c.inputBy=persona;c.obsReference=v.reference;c.instructions=v.instructions;c.status='Data Check Pending';log('OBS input recorded',`${v.reference}: ${v.instructions}`);render();toast('Data input recorded. Switch to CDDM Data Check for independent verification.');}
function completeCase(){const c=selected();if(persona!=='check'||c.status!=='Data Check Pending'||c.archived||persona===c.inputBy)return;if(!document.getElementById('checkedObs').checked)return toast('Confirm that you checked the OBS values.');c.checkBy=persona;c.status='Completed';log('OBS Implemented · assessment completed',`Independent check by ${people[persona].name}. Reference: ${c.obsReference}`);render();toast('Assessment completed. All four milestones are independently recorded.');}
function archiveCase(){const c=selected();if(c.status!=='Completed'||c.archived)return;c.archived=true;log('Assessment archived','Completed record retained as read-only · demo archival policy');render();toast('Assessment moved to Archival.');}
function historyView(c){return `<section class="panel"><div class="panelhead"><h2>Decision & activity history</h2><button class="small" onclick="exportAudit('${c.id}')">↓ Export JSON</button></div><div class="panelbody">${timeline(data.audit.filter(e=>e.caseId===c.id))}</div></section>`;}
function timeline(events){return `<div class="timeline">${events.map(e=>`<div class="event"><b>${esc(e.action)}</b><p>${esc(e.detail)}</p><time>${esc(e.actor)} · ${new Date(e.at).toLocaleString('en-US')}</time></div>`).join('')||'<p>No events in this view.</p>'}</div>`;}
function documentsView(){const ds=data.docs.filter(d=>(docFilter==='All'||d.status===docFilter)&&`${d.name} ${d.id} ${d.code} ${data.clients.find(c=>c.id===d.client)?.name}`.toLowerCase().includes(query.toLowerCase()));return heading('File cabinets / client tax','Document workspace','Shared records, controlled intake, verification, and replacement history.',`<button onclick="hiveDialog()">Retrieve from Hive</button><button class="primary" onclick="uploadDialog()">＋ Upload document</button>`)+`<div class="note">Document verification is automatically selected from type and ownership. The client browser simulates roles; production permissions and validations must be enforced by backend services.</div><section class="panel"><div class="toolbar"><div class="filters">${['All','Processing','Complete','Incomplete','Rejected','Replaced'].map(s=>`<button class="chip ${docFilter===s?'active':''}" onclick="docFilter='${s}';render()">${s}</button>`).join('')}</div><input aria-label="Search documents" placeholder="Search documents…" value="${esc(query)}" oninput="documentSearch(this)"></div><div class="tablewrap"><table><thead><tr><th>Document / ID</th><th>Client / ownership</th><th>Type</th><th>Format</th><th>Status</th><th>Validity</th><th></th></tr></thead><tbody>${ds.map(d=>`<tr><td><button class="linkbtn" onclick="documentDialog('${d.id}')"><b>${esc(d.name)}</b><small>${d.id} · revision ${d.version}</small></button></td><td>${esc(data.clients.find(c=>c.id===d.client)?.name)}<small>${d.owner}</small></td><td>${d.code}<small>${esc(d.subtype||'')}</small></td><td>${d.format}</td><td>${badge(d.status)}</td><td>${d.validTo||'Not specified'}</td><td><button class="small" onclick="documentDialog('${d.id}')">Open →</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No documents match.</td></tr>'}</tbody></table></div><div class="tablefoot">${ds.length} document records · binary uploads last for this browser session only</div></section>`;}
function documentSearch(input){const pos=input.selectionStart;query=input.value;render();const n=document.querySelector('[aria-label="Search documents"]');n.focus();n.setSelectionRange(pos,pos);}
function uploadDialog(predecessor=null){const old=predecessor?data.docs.find(d=>d.id===predecessor):null;showModal(old?'Upload replacement document':'Controlled document upload',`<form id="uploadForm" onsubmit="event.preventDefault();saveUpload('${predecessor||''}')"><div class="note">Each upload receives a new immutable Document ID. Files stay in memory for preview; only metadata persists locally. Use fictional documents only.</div><div class="formgrid"><label class="field full">Client<select name="client" ${old?'disabled':''}>${data.clients.map(c=>`<option value="${c.id}" ${(old?.client||selected()?.client)===c.id?'selected':''}>${esc(c.name)} · ${c.id}</option>`).join('')}</select></label><label class="field">Document Type<select name="code" onchange="uploadPolicy()" ${old?'disabled':''}>${documentTypes.map(d=>`<option value="${d[0]}" ${old?.code===d[0]?'selected':''}>${d[0]} · ${d[1]}</option>`).join('')}</select></label><label class="field">Ownership<select name="owner"><option ${old?.owner==='Partner'?'selected':''}>Partner</option><option ${old?.owner==='Account'?'selected':''}>Account</option></select></label><label class="field">Subtype<select name="subtype"><option>Natural / controlling person</option><option>Entity</option></select><span class="hint">Disambiguates repeated BAEI / BW8B codes. Demo supports individual BCTS only.</span></label><label class="field">Document Format<select name="format" onchange="uploadPolicy()"><option>Digital Original</option><option>Copy Valid as Original</option><option>Simple Copy</option><option>Paper Original</option></select></label><label class="field">Valid from<input type="date" name="validFrom" value="2026-09-23"></label><label class="field">Valid to<input type="date" name="validTo" value="2027-09-23"></label><label class="field full">Physical custody / source evidence<input name="custody" placeholder="Custody location for paper; source-channel evidence for digital"></label><label class="field full">Document file<in // Upload guidance presents the existing demo policy without adding tax rules.
function evaluateUpload(v,file,old){
 const country=countryCodes.includes(v.code),known=documentTypes.some(t=>t[0]===v.code);
 const item=(title,state,detail)=>({title,state,detail});
 const combination=known&&validCombination(v.code,v.owner,v.subtype)&&!(v.owner!=='Partner'&&['IDEN','BCLN'].includes(v.code));
 const allowed=(!country||v.format==='Paper Original');
 const authorized=v.format==='Paper Original'?persona==='scan':['Digital Original','Copy Valid as Original'].includes(v.format)?persona==='fo':v.format==='Simple Copy';
 const client=data.clients.some(c=>c.id===v.client);
 const dates=!(v.validFrom&&v.validTo&&v.validTo<v.validFrom);
 const custody=v.format!=='Paper Original'||Boolean(v.custody.trim());
 const validFile=file&&file.size<=15*1024*1024&&/\.(pdf|png|jpe?g|txt)$/i.test(file.name);
 const checks=[
 item('Document type',known?'pass':'pending',known?'Type exists in the configured demo inventory.':'Select a document type to begin.'),
 item('Client and ownership',!known?'pending':client&&combination?'pass':'fail',!known?'Waiting for document type.':client&&combination?'Client, ownership and subtype match the demo inventory. No live CMS check.':'Review the client, ownership and subtype combination.'),
 item('Permitted format',!known?'pending':allowed?'pass':'fail',!known?'Waiting for document type.':allowed?'Format meets the current demo rule.':'This country-document demo rule requires Paper Original.'),
 item('Uploader permission',authorized?'pass':'fail',authorized?people[persona].team+' can upload this format in the demo.':v.format==='Paper Original'?'Switch to CDDM Luxembourg for Paper Original.':'Digital Original and Copy Valid as Original require Front Office.'),
 item('Metadata and custody',!custody?'pending':dates?'pass':'fail',!custody?'Enter the physical-original custody location.':!dates?'Valid to must be on or after Valid from.':'Date order and applicable paper-custody fields checked. Dates remain optional under the existing demo policy.'),
 item('Document file',!file?'pending':validFile?'pass':'fail',!file?'Choose a PDF, PNG, JPEG or text file (up to 15 MB).':validFile?file.name+' — file extension and size accepted. Content scanning and PDF/A checks are not performed.':'Use PDF, PNG, JPEG or text, up to 15 MB.')
 ];
 const duplicates=known?data.docs.filter(d=>d.id!==old?.id&&d.client===v.client&&d.code===v.code&&d.owner===v.owner&&(d.subtype||'')===(['BAEI','BW8B'].includes(v.code)?v.subtype:'')&&!['Rejected','Replaced'].includes(d.status)):[];
 const locked=old&&(!editableDocument(old)||old.pendingSuccessor);
 return {checks,ready:checks.every(c=>c.state==='pass')&&!locked,country,duplicates,locked};
}
function refreshUploadReview(){
 const f=document.getElementById('uploadForm');if(!f||!document.getElementById('uploadReview'))return;
 const old=data.docs.find(d=>d.id===f.dataset.predecessor);
 const v=Object.fromEntries(['client','code','owner','subtype','format','validFrom','validTo','custody'].map(k=>[k,f.elements[k].value]));
 const result=evaluateUpload(v,f.elements.file.files[0],old);
 document.getElementById('uploadReview').innerHTML=`<h3>Before you upload</h3><p>Live guidance using this prototype’s existing rules. Upload starts verification; it does not grant Tax approval.</p><ul class="upload-checks">${result.checks.map(c=>`<li><span class="upload-check-icon ${c.state}" aria-hidden="true">${c.state==='pass'?'✓':c.state==='fail'?'!':'○'}</span><div><strong>${c.title} · ${c.state==='pass'?'Ready':c.state==='fail'?'Needs attention':'Not ready'}</strong><small>${esc(c.detail)}</small></div></li>`).join('')}</ul><div class="upload-ready" role="status">${result.locked?'Replacement is locked or already pending.':result.ready?'Ready to upload for verification':result.checks.filter(c=>c.state==='pass').length+' of 6 checks ready — complete the items above.'}</div><p><b>Automatic routing</b><br>${v.code?(result.country?'Country-Specific Tax Documents':'Single Tax Document Verification / supporting evidence')+' → CDDM Poland · Data Check':'Choose a document type to see its route.'}</p><p><b>Replacement and duplicate guidance</b><br>${old?'New record linked to '+esc(old.id)+'. The previous record remains in place until the replacement passes verification.':!v.code?'Waiting for document type.':result.duplicates.length?result.duplicates.length+' matching active record(s) found by metadata. If this is a revision, cancel and use “Upload newer version” on the existing record. This is not a binary duplicate check.':'No active records with matching client, type, ownership and subtype found. Binary duplicates are not checked.'}</p>`;
 const submit=f.querySelector('button[type="submit"]');submit.disabled=!result.ready;submit.setAttribute('aria-describedby','uploadReview');
 return result;
}
const uploadDialogBeforeGuidance=uploadDialog;
uploadDialog=function(pred){
 uploadDialogBeforeGuidance(pred);
 const f=document.getElementById('uploadForm');if(!f)return;
 f.dataset.predecessor=pred||'';
 const old=data.docs.find(d=>d.id===pred);
 if(old){f.elements.owner.value=old.owner;if(old.subtype)f.elements.subtype.value=old.subtype;}
 else{const option=new Option('Select document type…','',true,true);f.elements.code.prepend(option);}
 f.elements.code.required=true;
 const grid=f.querySelector('.formgrid'),layout=document.createElement('div');layout.className='upload-layout';
 grid.before(layout);layout.append(grid);
 const review=document.createElement('aside');review.id='uploadReview';review.className='upload-review';review.setAttribute('aria-label','Upload validation');layout.append(review);
 f.closest('.dialog').classList.add('large');
 f.addEventListener('input',refreshUploadReview);f.addEventListener('change',refreshUploadReview);
 uploadPolicy();refreshUploadReview();
};
const saveUploadBeforeGuidance=saveUpload;
saveUpload=function(pred){const review=refreshUploadReview();if(!review?.ready)return toast('Complete the upload checks before continuing.');saveUploadBeforeGuidance(pred);};

// Shared record projections for the landing screen; no duplicate demonstration store.
const homeWorkflowRegistry=[
 {id:'single',name:'Single Tax Document Verification',family:'Single Tax verification',trigger:'Automatic intake'},
 {id:'country',name:'Country-Specific Tax Documents',family:'Country documents',trigger:'Automatic intake'},
 {id:'bcts',name:'Account Tax Assessment / BCTS',family:'Account Tax Assessment',trigger:'Business process'},
 {id:'new',name:'Tax Relief · New Business',family:'Tax Relief at Source',trigger:'Business process'},
 {id:'end',name:'Tax Relief · Termination',family:'Tax Relief at Source',trigger:'Business process'}
];
let homeSearch='',homeFilter='All',homeWorkflow='all',homeOffset=0,homePersona=null;
const homeClock='2026-09-23';
function homeDefinition(id){return homeWorkflowRegistry.find(w=>w.id===id);}
function homeWorkItems(){
 const items=assignedCases().map(c=>({id:c.id,kind:'case',client:c.client,status:c.status,due:c.due||'',workflow:c.process==='Relief new'?'new':c.process==='Relief termination'?'end':'bcts',description:({'Draft':'Prepare the request and supporting evidence','Returned':'Resolve feedback and resubmit','Under Tax Review':'Review evidence and record a Tax decision','Implementation Pending':'Implement the approved instruction','Data Check Pending':'Independently check implementation'})[c.status]||c.status,documents:c.evidence.length}));
 if(persona==='scan')pendingIntake().forEach(x=>items.push({id:x.id,kind:'intake',client:x.client,status:x.status,due:'',workflow:countryCodes.includes(x.code)?'country':'single',description:x.name,documents:1}));
 if(persona==='check')pendingDocuments().forEach(d=>items.push({id:d.id,kind:'document',client:d.client,status:d.status,due:'',workflow:countryCodes.includes(d.code)?'country':'single',description:d.name,documents:1}));
 return items;
}
function homeFilteredItems(){return homeWorkItems().filter(w=>(homeWorkflow==='all'||w.workflow===homeWorkflow)&&(homeFilter==='All'||homeFilter==='Overdue'&&w.due&&w.due<homeClock||homeFilter==='Due today'&&w.due===homeClock||homeFilter==='Documents'&&w.kind!=='case')&&[w.id,data.clients.find(c=>c.id===w.client)?.name,w.description,homeDefinition(w.workflow).name].join(' ').toLowerCase().includes(homeSearch.toLowerCase()));}
function homeOpen(kind,id){const item=homeWorkItems().find(x=>x.kind===kind&&x.id===id);if(!item)return toast('This item is no longer in your actionable queue.');if(kind==='case')openCase(id);else if(kind==='document')documentDialog(id);else intakeDialog(id);}
function homeRefreshTable(){homeOffset=0;document.getElementById('homeResults').innerHTML=homeTable();}
function homeSelect(filter){homeFilter=filter;homeOffset=0;render();document.getElementById('homeWorkPanel')?.scrollIntoView({block:'nearest'});}
function homeMove(delta){homeOffset=Math.max(0,homeOffset+delta);document.getElementById('homeResults').innerHTML=homeTable();}
function homeTable(){const rows=homeFilteredItems();if(homeOffset>=rows.length)homeOffset=0;const visible=rows.slice(homeOffset,homeOffset+8);return `<div class="tablewrap"><table class="home-table"><thead><tr><th>Client / work item</th><th>Workflow / next action</th><th>Status</th><th>Due date</th><th>Documents</th><th></th></tr></thead><tbody>${visible.map(w=>`<tr><td><button class="linkbtn" onclick="homeOpen('${w.kind}','${w.id}')"><b>${esc(data.clients.find(c=>c.id===w.client)?.name||w.client)}</b><small>${esc(w.id)}</small></button></td><td>${homeDefinition(w.workflow).name}<small>${esc(w.description)}</small></td><td>${badge(w.status)}</td><td>${w.due?esc(w.due)+(w.due<homeClock?'<small class="danger">Overdue</small>':w.due===homeClock?'<small>Due today</small>':''):'<span class="muted">Not configured</span>'}</td><td>${w.documents} ${w.kind==='case'?'linked':'record'}</td><td><button class="small" aria-label="Open ${esc(w.id)}" onclick="homeOpen('${w.kind}','${w.id}')">${w.kind==='intake'?'Record scan':w.kind==='document'?'Verify':'Open'} →</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No actionable items match these filters.<br><button onclick="homeSearch=\'\';homeWorkflow=\'all\';homeSelect(\'All\')">Clear filters</button></td></tr>'}</tbody></table></div><div class="tablefoot home-pagination"><span role="status">${rows.length?homeOffset+1:0}–${Math.min(homeOffset+8,rows.length)} of ${rows.length} matching items · ${people[persona].team}</span><div class="actions"><button class="small" onclick="homeMove(-8)" ${homeOffset===0?'disabled':''}>Previous</button><button class="small" onclick="homeMove(8)" ${homeOffset+8>=rows.length?'disabled':''}>Next</button></div></div>`;}
function homeWorkflowCards(){const items=homeWorkItems();return `<div class="home-catalog">${homeWorkflowRegistry.map(w=>`<button class="home-workflow" onclick="homeWorkflow='${w.id}';homeFilter='All';homeSearch='';homeOffset=0;render();document.getElementById('homeWorkPanel').scrollIntoView({block:'start'})"><span class="home-kicker">${w.trigger}</span><b>${w.name}</b><span>${items.filter(i=>i.workflow===w.id).length} in my queue <span aria-hidden="true">→</span></span></button>`).join('')}</div>`;}
overviewView=function(){
 if(homePersona!==persona){homeSearch='';homeFilter='All';homeWorkflow='all';homeOffset=0;homePersona=persona;}
 const focus=roleFocus[persona],items=homeWorkItems(),overdue=items.filter(w=>w.due&&w.due<homeClock).length,today=items.filter(w=>w.due===homeClock).length,docs=items.filter(w=>w.kind!=='case').length;
 const groups=[...new Set(items.map(w=>w.status))].map(status=>({status,count:items.filter(w=>w.status===status).length}));
 const pending=data.cases.filter(c=>!c.archived&&c.status==='Account Pending');
 return `<div class="home-dashboard">`+heading(focus.title,`Welcome back, ${people[persona].name.split(' ')[0]}`,focus.description,`<button onclick="navigate('library')">Process library</button><button class="primary" onclick="navigate('${focus.route}')">${focus.action} →</button>`)+`<div class="home-metrics">${[['My actionable work',items.length,'Cases, intake and verification','All'],['Overdue cases',overdue,'Prioritize existing due dates','Overdue'],['Cases due today',today,'Based on the demo business date','Due today'],['Document work',docs,'Scanning or verification tasks','Documents']].map(([title,note,caption,f])=>`<button class="home-metric ${f==='Overdue'&&note?'home-attention':''}" onclick="homeSelect('${f}')"><span>${title}</span><strong>${note}</strong><small>${caption} →</small></button>`).join('')}</div><div class="home-context"><span><b>${esc(people[persona].team)}</b> · Counts update from shared records as work progresses.</span><span>Demo date: September 23, 2026</span></div><section class="panel" id="homeWorkPanel"><div class="panelhead"><div><h2>Your work, in one place</h2><p>Actionable work for this persona across the configured workflow families.</p></div><button onclick="navigate('tasks')">Full task workspace →</button></div><div class="toolbar home-toolbar"><div class="filters">${['All','Overdue','Due today','Documents'].map(f=>`<button class="chip ${homeFilter===f?'active':''}" aria-pressed="${homeFilter===f}" onclick="homeSelect('${f}')">${f}</button>`).join('')}</div><label class="home-search"><span class="sr-only">Search my work</span><input type="search" placeholder="Search client, ID or workflow…" value="${esc(homeSearch)}" oninput="homeSearch=this.value;homeRefreshTable()"></label><select aria-label="Filter workflow" onchange="homeWorkflow=this.value;homeRefreshTable()"><option value="all">All workflow paths</option>${homeWorkflowRegistry.map(w=>`<option value="${w.id}" ${homeWorkflow===w.id?'selected':''}>${w.name}</option>`).join('')}</select></div><div id="homeResults">${homeTable()}</div></section><div class="home-two"><section class="panel"><div class="panelhead"><div><h2>My work by status</h2><p>Current work items · no combined case-completion score</p></div></div><div class="panelbody">${groups.map(g=>`<div class="home-bar"><span>${esc(g.status)}</span><div class="home-track" aria-hidden="true"><i style="width:${g.count/items.length*100}%;background:${['Returned','Incomplete'].includes(g.status)?'#a62a32':'#386b88'}"></i></div><b>${g.count}</b></div>`).join('')||'<p>Your actionable queue is clear.</p>'}<p class="home-footnote">Document completion, Tax approval and implementation are separate outcomes.</p></div></section><section class="panel"><div class="panelhead"><div><h2>${persona==='scan'?'Intake handoff':persona==='check'?'Review handoff':'Dependencies & history'}</h2><p>Related shared workspace information</p></div></div><div class="panelbody">${persona==='scan'?`<div class="queue"><div><b>${(data.intake||[]).filter(x=>x.status==='Scanned').length} scans recorded</b><p>Scanning completion does not verify the document.</p></div><button onclick="navigate('documents')">Documents →</button></div>`:persona==='check'?`<div class="queue"><div><b>${assignedCases().length} implementation checks</b><p>Separate from ${pendingDocuments().length} document reviews.</p></div><button onclick="navigate('tasks')">Review →</button></div>`:`<div class="queue"><div><b>${pending.length} account dependencies</b><p>Shared register · waiting for an account-created event.</p></div><button onclick="navigate('cases');setFilter('Account Pending')">View →</button></div>`}<div class="queue"><div><b>Completion library</b><p>Completed and rejected requests; shared history.</p></div><button onclick="navigate('completed')">Open →</button></div><div class="queue"><div><b>Archival</b><p>Archived requests and their retained evidence.</p></div><button onclick="navigate('archive')">Open →</button></div></div></section></div><section class="panel"><div class="panelhead"><div><h2>Explore workflow paths</h2><p>Four families · five execution paths · select a card to filter your work.</p></div><button onclick="navigate('library')">Start a business process →</button></div><div class="panelbody">${homeWorkflowCards()}<p class="home-footnote">Document verification starts automatically through controlled intake. New workflow families can be added when their requirements and permissions are approved.</p></div></section><p class="footerhint">Fictional records · shared saved state across all personas · document and intake deadlines are not configured in this demo.</p></div>`;
};

<script>
/* Review build 7 · client-operations dashboard.
   Every number is computed from the shared demo store (cases, documents, intake).
   Only the April–August volume bars use a seeded sample history, labelled on screen. */
(function(){
const byId=Object.fromEntries(navItems.map(n=>[n[0],n]));
const relabel={overview:['home','Dashboard'],cases:['cases','Workflows & Tasks'],tasks:['cases','My Workflows & Tasks'],documents:['docs','Search Document Workflows']};
Object.entries(relabel).forEach(([k,[i,t]])=>{if(byId[k]){byId[k][1]=i;byId[k][2]=t;}});
const order=['overview','cases','tasks','documents','library','completed','archive','audit','integrations','decisions','rules'];
navItems.sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0]));
})();
data.volumeSample ||= {'2026-04':[34,26],'2026-05':[48,35],'2026-06':[52,47],'2026-07':[70,57],'2026-08':[76,70]};
let dxView='all',dxQuery='',dxType='all',dxPrio='all',dxStatus=null,dxRange=6,dxOpen=null,dxAllDocs=false,dxAllWf=false;
let dxExp=new Set();
let dxCols=new Set(['wf','doc','owner','progress','files','sla','status','priority']);
const DX_TODAY=homeClock;
const dxDays=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const dxAdd=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
const dxIcon={doc:'M7 3h7l5 5v13H7z M14 3v5h5',clip:'M9 4h6v3H9z M7 5H5v16h14V5h-2 M9 13l2 2 4-4',flow:'M6 6h4v4H6z M14 14h4v4h-4z M10 8h4v6',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v5l3 2',list:'M4 6h11 M4 12h11 M4 18h7 M18 5l1.5 1.5L22 4 M18 11l1.5 1.5L22 10',filter:'M4 6h16 M7 12h10 M10 18h4',dl:'M12 4v11 M7 10l5 5 5-5 M5 20h14',cols:'M4 4h16v16H4z M10 4v16 M16 4v16',plus:'M12 5v14 M5 12h14',up:'M7 17 17 7 M9 7h8v8'};
const dxSvg=k=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${dxIcon[k]}"/></svg>`;
function dxLabel(code){const r=(typeof inventory!=='undefined'?inventory:[]).find(x=>x[0]===code);return r?r[1]:(documentTypes.find(t=>t[0]===code)||[])[1]||code;}
function dxType_(p){return p==='Relief new'||p==='Relief termination'?'TRAS':'BCTS';}
const DX_TYPES={STDV:'Single Tax Document Verification',CSTD:'Country Specific Tax Documents',TRAS:'Tax Relief at Source',BCTS:'BCTS Tax Checklist'};
const DX_STEPS={Draft:1,Returned:1,'Under Tax Review':2,'Account Pending':3,'Implementation Pending':4,'Data Check Pending':5,Completed:6,Rejected:2};
const DX_CHILD={Draft:'Preparation task',Returned:'Correction task','Under Tax Review':'Review task','Account Pending':'Waiting · account event','Implementation Pending':'OBS input task','Data Check Pending':'Data check task'};
function dxGroup(s){return ({Draft:'Drafting',Returned:'Returned for Correction',Incomplete:'Returned for Correction','Account Pending':'Blocked/Waiting',Completed:'Completed',Complete:'Completed',Rejected:'Rejected'})[s]||'In-Progress';}
function dxSla(status,due){
 if(['Completed','Complete'].includes(status))return['Within SLA','p-green'];
 if(status==='Rejected')return['Closed','p-gray'];
 if(status==='Account Pending')return['Paused · waiting','p-gray'];
 if(!due)return['No SLA','p-gray'];
 const d=dxDays(due,DX_TODAY);
 return d<0?[`Overdue ${-d}d`,'p-red']:d===0?['Due today','p-amber']:[`Due in ${d}d`,d<=2?'p-amber':'p-blue'];}
function dxPriority(status,due){if(['Completed','Complete','Rejected'].includes(status))return'Low';if(due&&dxDays(due,DX_TODAY)<=0)return'High';if(due&&dxDays(due,DX_TODAY)<=2)return'Normal';return'Normal';}
function dxRows(){
 const rows=[];
 data.cases.filter(c=>!c.archived).forEach(c=>{
  const owner=roleOwner(c),first=c.evidence.map(id=>data.docs.find(d=>d.id===id)).find(Boolean);
  const code=c.process==='BCTS'||!c.process?(first?.code||'BCTS'):(c.relief?.country==='Poland'?'BPCR':'BCRD');
  rows.push({kind:'case',id:c.id,type:dxType_(c.process),wf:c.process==='Relief termination'?'Tax Relief · Termination':c.process==='Relief new'?'Tax Relief · New Business':'BCTS Tax Checklist',
   child:DX_CHILD[c.status]||'',client:clientOf(c)?.name||c.client,code,desc:dxLabel(code),
   owner:owner?people[owner].name:c.status==='Account Pending'?'System':'—',team:owner?people[owner].team:c.status==='Account Pending'?'BECOM account event':'No open task',mine:owner===persona,
   step:DX_STEPS[c.status]||2,total:6,files:c.evidence.length,status:c.status,due:c.due,created:c.created});
 });
 data.docs.filter(d=>['Processing','Incomplete'].includes(d.status)).forEach(d=>{
  const country=countryCodes.includes(d.code),due=dxAdd(d.uploaded||DX_TODAY,3);
  rows.push({kind:'document',id:d.id,type:country?'CSTD':'STDV',wf:DX_TYPES[country?'CSTD':'STDV'],child:d.status==='Incomplete'?'Correction task':'Verification task',
   client:data.clients.find(c=>c.id===d.client)?.name||d.client,code:d.code,desc:dxLabel(d.code),owner:people.check.name,team:people.check.team,mine:persona==='check',
   step:d.status==='Incomplete'?1:2,total:3,files:1,status:d.status,due,created:d.uploaded,slaNote:'Illustrative 3-day verification SLA (D-14)'});
 });
 (data.intake||[]).filter(x=>x.status==='Awaiting scan').forEach(x=>rows.push({kind:'intake',id:x.id,type:countryCodes.includes(x.code)?'CSTD':'STDV',wf:DX_TYPES[countryCodes.includes(x.code)?'CSTD':'STDV'],child:'Scan task',
  client:data.clients.find(c=>c.id===x.client)?.name||x.client,code:x.code,desc:dxLabel(x.code),owner:people.scan.name,team:people.scan.team,mine:persona==='scan',step:1,total:3,files:0,status:'Awaiting scan',due:dxAdd(x.received,1),created:x.received,slaNote:'Illustrative 1-day scan SLA (D-14)'}));
 return rows;}
const DX_ORDER={Draft:0,Returned:0,'Under Tax Review':1,'Account Pending':2,'Implementation Pending':3,'Data Check Pending':4,Completed:9,Rejected:1};
function dxP(k){return{who:people[k].name,team:people[k].team};}
function dxTasks(r){
 const T=(name,st,who,team,extra={})=>({name,st,who,team,...extra});
 if(r.kind==='case'){
  const c=data.cases.find(x=>x.id===r.id);if(!c)return[];
  const relief=c.process==='Relief new'||c.process==='Relief termination';
  const tpl=[['Prepare & submit','fo'],['Tax review','tax'],relief?null:['Account confirmation','sys'],['OBS data input','input'],['Data check (4-eyes)','check']].filter(Boolean);
  const pos=k=>({fo:0,tax:1,sys:2,input:3,check:4})[k];
  const at=DX_ORDER[c.status]??1,out=[];
  const who=k=>k==='sys'?{who:'System',team:'BECOM account event'}:dxP(k);
  tpl.forEach(([name,k])=>{const p=pos(k);
   if(c.status==='Returned'&&k==='tax'){out.push(T('Tax review','returned',who(k).who,who(k).team,{note:'Returned for correction'}));out.push(T('Correction','active',people.fo.name,people.fo.team,{note:(c.deficiencies||[]).filter(d=>!d.resolved).length+' open deficiency'}));out.push(T('Tax re-review','todo','Candidate group',people.tax.team));return;}
   if(c.status==='Returned'&&k==='fo'){out.push(T(name,'done',who(k).who,who(k).team));return;}
   if(c.status==='Rejected'){out.push(T(name,p===0?'done':p===1?'rejected':'cancelled',p<=1?who(k).who:'—',who(k).team));return;}
   const st=c.status==='Completed'||p<at?'done':p===at?(k==='sys'?'waiting':'active'):'todo';
   out.push(T(name,st,st==='todo'&&k!=='sys'?'Candidate group':who(k).who,who(k).team));});
  return out;}
 if(r.kind==='document'){const inc=r.status==='Incomplete';
  return[T('Scan & index','done',people.scan.name,people.scan.team),T('Document verification',inc?'returned':'active',people.check.name,people.check.team,inc?{note:'Marked incomplete'}:{}),...(inc?[T('Replace / correct document','active',people.fo.name,people.fo.team),T('Re-verification','todo','Candidate group',people.check.team)]:[])];}
 return[T('Scan & index','active',people.scan.name,people.scan.team),T('Document verification','todo','Candidate group',people.check.team)];}
function dxTaskCount(r){const t=dxTasks(r);return{done:t.filter(x=>['done','returned','rejected'].includes(x.st)).length,total:t.filter(x=>x.st!=='cancelled').length,list:t};}
const DX_TS={done:['✓','Completed','p-green'],active:['●','In progress','p-blue'],waiting:['◷','Waiting','p-gray'],todo:['○','Not started','p-gray'],returned:['↩','Returned','p-red'],rejected:['✕','Rejected','p-red'],cancelled:['–','Cancelled','p-gray']};
function dxToggleRow(id,e){e.stopPropagation();dxExp.has(id)?dxExp.delete(id):dxExp.add(id);document.getElementById('dxTable').innerHTML=dxTable();}
function dxExpandAll(){const rows=dxFiltered();const all=rows.every(r=>dxExp.has(r.id));rows.forEach(r=>all?dxExp.delete(r.id):dxExp.add(r.id));document.getElementById('dxTable').innerHTML=dxTable();}
function dxSubRow(r,t,i,cols){return`<tr class="dx-sub dx-s-${t.st}">${cols.map(([k])=>{
 if(k==='wf')return`<td><div class="dx-task"><span class="dx-ti">${DX_TS[t.st][0]}</span><div><b>${i+1}. ${esc(t.name)}</b>${t.note?`<small>${esc(t.note)}</small>`:''}</div></div></td>`;
 if(k==='owner')return`<td><b>${esc(t.who)}</b><small>${esc(t.team)}</small></td>`;
 if(k==='sla'){if(t.st==='active'){const[a,c]=dxSla(r.status,r.due);return`<td><span class="dx-pill ${c}">${a}</span></td>`;}return'<td></td>';}
 if(k==='status')return`<td><span class="dx-pill ${DX_TS[t.st][2]} dx-tp">${DX_TS[t.st][1]}</span></td>`;
 return'<td></td>';}).join('')}</tr>`;}
function dxActive(r){return!['Completed','Complete','Rejected'].includes(r.status);}
function dxViewRows(all){return all.filter(r=>({all:true,mine:r.mine&&dxActive(r),overdue:dxActive(r)&&r.due&&r.due<DX_TODAY&&r.status!=='Account Pending',review:['Under Tax Review','Processing','Data Check Pending'].includes(r.status)})[dxView]);}
function dxFiltered(){const q=dxQuery.toLowerCase();return dxViewRows(dxRows()).filter(r=>(dxType==='all'||r.type===dxType)&&(dxPrio==='all'||dxPriority(r.status,r.due)===dxPrio)&&(!dxStatus||dxGroup(r.status)===dxStatus)&&(!q||`${r.id} ${r.wf} ${r.client} ${r.code} ${r.desc} ${r.owner} ${r.team} ${r.status}`.toLowerCase().includes(q)));}
function dxProgColor(r){const g=dxGroup(r.status);return g==='Completed'?'#2f6f48':g==='Returned for Correction'||g==='Rejected'?'#b5121b':g==='Blocked/Waiting'?'#a3a4a8':r.due&&r.due<=DX_TODAY?'#c9861a':'#1486a8';}
const DX_COLS=[['wf','Workflow / tasks'],['doc','Document Type and Description'],['owner','Owner / team'],['progress','Progress'],['files','Documents'],['sla','SLA'],['status','Status'],['priority','Priority']];
function dxCell(k,r){
 if(k==='wf'){const n=dxTaskCount(r),o=dxExp.has(r.id);return`<td><div class="dx-wf"><button class="dx-exp ${o?'on':''}" aria-expanded="${o}" aria-label="${o?'Hide':'Show'} tasks" onclick="dxToggleRow('${r.id}',event)"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button><div><b>${esc(r.wf)}</b><small>${esc(r.id)} · <span class="dx-tc" onclick="dxToggleRow('${r.id}',event)">${n.total} tasks</span></small></div></div></td>`;}
 if(k==='doc')return`<td><b>${esc(r.code)}</b><small>${esc(r.desc)}</small></td>`;
 if(k==='owner')return`<td><b>${esc(r.owner)}</b><small>${esc(r.team)}</small></td>`;
 if(k==='progress'){const n=dxTaskCount(r);return`<td><div class="dx-prog" title="${n.done} of ${n.total} tasks completed"><div class="dx-bar"><i style="width:${Math.round(n.done/Math.max(1,n.total)*100)}%;background:${dxProgColor(r)}"></i></div><em>${n.done} of ${n.total} tasks</em></div></td>`;}
 if(k==='files')return`<td>${r.files} ${r.files===1?'file':'files'}<small>${esc(r.client)}</small></td>`;
 if(k==='sla'){const[t,c]=dxSla(r.status,r.due);return`<td><span class="dx-pill ${c}" ${r.slaNote?`title="${esc(r.slaNote)}"`:''}>${t}</span></td>`;}
 if(k==='status'){const g=dxGroup(r.status),c=g==='Completed'?'p-green':g==='Returned for Correction'||g==='Rejected'?'p-red':g==='Blocked/Waiting'||g==='Drafting'?'p-gray':r.status==='Under Tax Review'?'p-amber':'p-blue';return`<td><span class="dx-pill ${c}">${esc(r.status)}</span></td>`;}
 if(k==='priority'){const p=dxPriority(r.status,r.due);return`<td class="dx-prio"><i style="background:${p==='High'?'#b5121b':p==='Normal'?'#55575b':'#a3a4a8'}"></i>${p}</td>`;}}
function dxTable(){const rows=dxFiltered(),cols=DX_COLS.filter(c=>dxCols.has(c[0]));
 return`<div class="dx-tw"><table class="dx-table"><thead><tr>${cols.map(([k,l])=>`<th><span class="f">${l}${dxSvg('filter')}</span></th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr tabindex="0" onclick="dxOpenRow('${r.kind}','${r.id}')" onkeydown="if(event.key==='Enter')dxOpenRow('${r.kind}','${r.id}')">${cols.map(([k])=>dxCell(k,r)).join('')}</tr>${dxExp.has(r.id)?dxTasks(r).map((t,i)=>dxSubRow(r,t,i,cols)).join(''):''}`).join('')||`<tr><td colspan="${cols.length}" class="dx-empty">No workflows match this view.</td></tr>`}</tbody></table></div><div class="dx-foot"><span>${rows.length} workflow${rows.length===1?'':'s'} shown${dxStatus?` · status: ${dxStatus} <button class="dx-chip" onclick="dxStatus=null;render()">Clear</button>`:''}</span><span>Demo clock ${DX_TODAY} · SLA values are illustrative (D-14)</span></div>`;}
function dxOpenRow(kind,id){if(kind==='case')openCase(id);else if(kind==='document')documentDialog(id);else{if(persona!=='scan')return toast('Switch to CDDM Luxembourg to record this scan.');intakeDialog(id);}}
function dxToggle(which,e){e&&e.stopPropagation();dxOpen=dxOpen===which?null:which;render();}
document.addEventListener('click',e=>{if(dxOpen&&!e.target.closest('.dx-pop')){dxOpen=null;if(page==='overview')render();}});
function dxExport(){const rows=dxFiltered(),q=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';
 download('docuflow-workflows.csv',[['Workflow','Tasks (done/total)','ID','Client','Document type','Description','Owner','Team','Task detail','Documents','SLA','Status','Priority'],...rows.map(r=>{const n=dxTaskCount(r);return[r.wf,`${n.done}/${n.total}`,r.id,r.client,r.code,r.desc,r.owner,r.team,n.list.map(t=>`${t.name}: ${DX_TS[t.st][1]}`).join(' | '),r.files,dxSla(r.status,r.due)[0],r.status,dxPriority(r.status,r.due)]})].map(x=>x.map(q).join(',')).join('\n'),'text/csv');}
const DX_C={total:'#1486a8',done:'#7fd3e6'};
const DX_STATUS=[['In-Progress','#1ba3c6'],['Drafting','#e0a526'],['Completed','#2f9e6e'],['Blocked/Waiting','#3b5fc4'],['Returned for Correction','#e46f5a'],['Rejected','#8e6fd1']];
